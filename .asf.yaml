# see https://s.apache.org/asfyaml
github:
  description: "Apache Maven Wrapper"
  homepage: https://maven.apache.org/tools/wrapper
  labels:
    - java
    - build-management
    - apache-maven
    - maven
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  protected_branches:
    master: {}
  pull_requests:
    del_branch_on_merge: true
  features:
    issues: true

notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org

# https://releases.apache.org/projects/maven-wrapper
project:
  metadata:
    key: maven-wrapper
    committee: maven
    name: Apache Maven Wrapper
    description: The Maven Wrapper is an easy way to ensure a user of your Maven build has everything necessary to run your Maven build.
    homepage: https://maven.apache.org/tools/wrapper/
    download_page: https://maven.apache.org/tools/wrapper/download.cgi
    bug_database: https://maven.apache.org/tools/wrapper/issue-management.html
    mailing_lists: https://maven.apache.org/tools/wrapper/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-wrapper
    categories:
      - build-management
    programming_languages:
      - Java
  policy:
    announce_release_template_url: https://maven.apache.org/atr/templates/announce_release_template.txt
    start_vote_template_url: https://maven.apache.org/atr/templates/start_vote_template.txt
    finish_vote_template_url: https://maven.apache.org/atr/templates/finish_vote_template.txt
    github_repository_name: maven-wrapper
    download_path_suffix: wrapper
    vote_recipients:
      to: dev@maven.apache.org
    announce_recipients:
      to: announce@maven.apache.org
      cc:
        - dev@maven.apache.org
        - users@maven.apache.org
  features:
    atr_sync: true
